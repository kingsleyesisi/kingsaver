<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>King Saver - Instagram Downloader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        king: {
                            gold: '#FFD700',
                            red: '#FF0000',
                            dark: '#1a1a1a',
                            darker: '#0f0f0f',
                            accent: '#FACC15'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    animation: {
                        'spin-slow': 'spin 3s linear infinite',
                        'pulse-fast': 'pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        loading: {
                            '0%': { transform: 'scaleX(0)' },
                            '100%': { transform: 'scaleX(1)' }
                        },
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Instagram Icon SVG -->
    <link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/e/e7/Instagram_logo_2016.svg"
        type="image/svg+xml">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .gradient-text {
            background: linear-gradient(to right, #833AB4, #FD1D1D, #FCAF45);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>

<body class="bg-king-darker text-white min-h-screen flex flex-col overflow-x-hidden">

    <!-- Header -->
    <header class="w-full p-6 glass sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <a href="/" class="flex items-center gap-3 hover:opacity-80 transition-opacity">
                <div
                    class="w-10 h-10 bg-gradient-to-tr from-purple-600 to-pink-600 rounded-full flex items-center justify-center shadow-lg shadow-pink-500/20">
                    <svg class="w-5 h-5 text-white fill-current" viewBox="0 0 24 24">
                        <path
                            d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z" />
                    </svg>
                </div>
                <h1 class="text-2xl font-bold tracking-tight"><span class="text-white">King</span> <span
                        class="gradient-text">Saver</span> <span
                        class="text-xs text-gray-500 font-normal ml-2">Instagram Edition</span></h1>
            </a>

            <div class="flex items-center gap-2 text-sm text-gray-400">
                <a href="/" class="hover:text-white transition-colors">Home</a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow container mx-auto px-4 py-12 max-w-5xl">

        <!-- Hero Section -->
        <div class="text-center mb-12 animate-[fadeIn_1s_ease-out]">
            <h2 class="text-4xl md:text-5xl font-extrabold mb-4">Download Instagram Reels <br class="hidden md:block" />
                <span class="gradient-text">Free & Fast</span>
            </h2>
            <p class="text-gray-400 text-lg">Save Videos and Reels from Instagram easily.</p>
        </div>

        <!-- Tabs -->
        <div class="flex justify-center mb-8 gap-4 animate-[fadeIn_0.5s_ease-out]">
            <button id="tab-single" onclick="switchTab('single')"
                class="px-6 py-2 rounded-lg text-sm font-medium transition-all bg-white text-black shadow-lg hover:bg-gray-200">
                Single Video
            </button>
            <button id="tab-history" onclick="switchTab('history')"
                class="px-6 py-2 rounded-lg text-sm font-medium transition-all text-gray-400 hover:text-white">
                History
            </button>
        </div>

        <!-- Input Area -->
        <div class="glass p-8 rounded-3xl shadow-2xl mb-12 border border-gray-800 relative overflow-hidden group">
            <div
                class="absolute inset-0 bg-gradient-to-r from-pink-500/5 to-purple-500/5 opacity-0 group-hover:opacity-100 transition-opacity duration-500">
            </div>

            <!-- Single Link Input -->
            <div id="single-input-area" class="relative z-10 transition-all duration-300">
                <div class="flex flex-col md:flex-row gap-4">
                    <input type="text" id="single-url" placeholder="Paste Instagram link here..."
                        class="flex-grow bg-king-dark border border-gray-700 text-white rounded-xl px-6 py-4 outline-none focus:border-pink-500 focus:ring-1 focus:ring-pink-500 transition-all text-lg placeholder-gray-600">
                    <button onclick="processSingle()"
                        class="bg-gradient-to-r from-purple-600 to-pink-600 text-white font-bold py-4 px-8 rounded-xl hover:shadow-lg hover:shadow-pink-500/20 transform hover:-translate-y-0.5 transition-all flex items-center justify-center gap-2 min-w-[160px]">
                        <span>Fetch</span>
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd"
                                d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z"
                                clip-rule="evenodd" />
                        </svg>
                    </button>
                </div>
            </div>

            <!-- History Area -->
            <div id="history-area" class="relative z-10 hidden transition-all duration-300">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-xl font-bold text-white">Download History</h3>
                    <button onclick="clearHistory()" class="text-xs text-red-500 hover:text-red-400 font-medium">Clear
                        History</button>
                </div>
                <p class="text-gray-400 text-sm">Your recent downloads appear below.</p>
            </div>
        </div>

        <!-- Loading State -->
        <div id="loading" class="hidden flex-col items-center justify-center py-12">
            <div class="relative w-20 h-20">
                <div class="absolute top-0 left-0 w-full h-full border-4 border-gray-800 rounded-full"></div>
                <div
                    class="absolute top-0 left-0 w-full h-full border-4 border-t-pink-500 border-r-transparent border-b-transparent border-l-transparent rounded-full animate-spin">
                </div>
            </div>
            <p class="mt-6 text-gray-400 font-medium animate-pulse">Fetching video details...</p>
        </div>

        <!-- Results Section -->
        <div id="results" class="flex flex-col gap-6 justify-center items-center w-full">
            <!-- Cards will be injected here -->
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-black py-8 border-t border-gray-900 mt-auto">
        <div class="container mx-auto px-4 text-center">
            <p class="text-gray-500 font-medium mb-2">Designed & Made by The King 👑</p>
            <p class="text-sm text-gray-600 flex items-center justify-center gap-2">
                <span>Kings World</span>
                <span class="w-1 h-1 bg-gray-600 rounded-full"></span>
                <span>&copy; 2025 </span>
            </p>
        </div>
    </footer>

    <script src="js/instagram.js"></script>
</body>

</html>
