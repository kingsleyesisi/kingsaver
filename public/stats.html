<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KingSaver Stats - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: #0f172a;
            /* Slate 900 */
            color: #f8fafc;
        }

        .card {
            background: rgba(30, 41, 59, 0.7);
            /* Slate 800 with opacity */
            backdrop-filter: blur(10px);
            border: 1px solid rgba(148, 163, 184, 0.1);
            border-radius: 1rem;
        }
    </style>
</head>

<body class="min-h-screen p-6">
    <div class="max-w-7xl mx-auto">
        <header class="mb-10 flex justify-between items-center">
            <div>
                <h1
                    class="text-4xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-500">
                    KingSaver Stats
                </h1>
                <p class="text-slate-400 mt-2">Live Visitor Analytics</p>
            </div>
            <button onclick="fetchStats()"
                class="px-4 py-2 bg-blue-600 hover:bg-blue-700 rounded-lg transition text-sm font-medium">
                Running 🟢
            </button>
        </header>

        <!-- Key Metrics -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
            <div class="card p-6">
                <h3 class="text-slate-400 text-sm font-medium mb-2">Total Visits (All Time)</h3>
                <p class="text-4xl font-bold text-white" id="totalVisits">-</p>
            </div>
            <div class="card p-6">
                <h3 class="text-slate-400 text-sm font-medium mb-2">Visits (Last 24h)</h3>
                <p class="text-4xl font-bold text-emerald-400" id="last24hVisits">-</p>
            </div>
            <!-- Add more metrics if desired -->
        </div>

        <!-- Charts Section -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8">
            <div class="card p-6 lg:col-span-2">
                <h3 class="text-lg font-semibold mb-4">Traffic Over Time (24h)</h3>
                <canvas id="trafficChart" height="300"></canvas>
            </div>
            <div class="card p-6">
                <h3 class="text-lg font-semibold mb-4">Platform Usage</h3>
                <div class="relative h-64">
                    <canvas id="platformChart"></canvas>
                </div>
                <div id="platformList" class="mt-4 space-y-2 text-sm">
                    <!-- Populated by JS -->
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-1 gap-6 mb-8">
            <div class="card p-6">
                <h3 class="text-lg font-semibold mb-4">Top Paths</h3>
                <div class="overflow-hidden">
                    <table class="w-full text-sm text-left">
                        <thead class="text-xs text-slate-400 uppercase bg-slate-800/50">
                            <tr>
                                <th class="px-4 py-3">Path</th>
                                <th class="px-4 py-3 text-right">Visits</th>
                            </tr>
                        </thead>
                        <tbody id="topPathsBody" class="divide-y divide-slate-700">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Recent Logs -->
        <div class="card p-6">
            <h3 class="text-lg font-semibold mb-4">Recent Activity</h3>
            <div class="overflow-x-auto">
                <table class="w-full text-sm text-left text-slate-300">
                    <thead class="text-xs text-slate-400 uppercase bg-slate-800/50">
                        <tr>
                            <th class="px-4 py-3">Time</th>
                            <th class="px-4 py-3">Method</th>
                            <th class="px-4 py-3">Path</th>
                            <th class="px-4 py-3">IP</th>
                            <th class="px-4 py-3">User Agent</th>
                        </tr>
                    </thead>
                    <tbody id="recentLogsBody" class="divide-y divide-slate-700">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        let chartInstance = null;

        async function fetchStats() {
            try {
                // Browser usually handles the Basic Auth prompt automatically if 401 is returned
                const res = await fetch('/api/stats');

                if (res.status === 401) {
                    // This reload triggers the browser's native auth dialog again if it failed
                    window.location.reload();
                    return;
                }

                const data = await res.json();
                renderStats(data);
            } catch (error) {
                console.error('Error fetching stats:', error);
            }
        }

        function renderStats(data) {
            // KPI
            document.getElementById('totalVisits').textContent = data.total;

            // Calculate last 24h explicitly from the chart data or just use a placeholder if not computed on server
            // For now, let's sum up the hourly data
            const last24h = data.overTime.reduce((acc, curr) => acc + parseInt(curr.count), 0);
            document.getElementById('last24hVisits').textContent = last24h;

            // Top Paths
            const topPathsBody = document.getElementById('topPathsBody');
            topPathsBody.innerHTML = data.byPath.map(p => `
                <tr class="hover:bg-slate-700/30 transition">
                    <td class="px-4 py-3 font-mono text-blue-300">${p.path}</td>
                    <td class="px-4 py-3 text-right font-bold">${p.count}</td>
                </tr>
            `).join('');

            // Recent Logs
            const recentLogsBody = document.getElementById('recentLogsBody');
            recentLogsBody.innerHTML = data.recent.map(r => `
                <tr class="hover:bg-slate-700/30 transition">
                    <td class="px-4 py-3 text-slate-400">${new Date(r.timestamp).toLocaleTimeString()}</td>
                    <td class="px-4 py-3"><span class="px-2 py-1 rounded text-xs font-bold ${getMethodColor(r.method)}">${r.method}</span></td>
                    <td class="px-4 py-3 font-mono text-blue-300">${r.path}</td>
                    <td class="px-4 py-3 text-slate-500 text-xs">${r.ip || 'Unknown'}</td>
                    <td class="px-4 py-3 text-slate-500 text-xs truncate max-w-xs" title="${r.user_agent}">${r.user_agent ? r.user_agent.substring(0, 30) + '...' : '-'}</td>
                </tr>
            `).join('');

            // Chart
            const ctx = document.getElementById('trafficChart').getContext('2d');

            // Prepare labels and data
            // data.overTime is array of { time: 'ISO...', count: 'N' }
            // Ensure we have all hours filled? For simplicity just map existing.
            const labels = data.overTime.map(d => new Date(d.time).getHours() + ':00');
            const counts = data.overTime.map(d => parseInt(d.count));

            if (chartInstance) chartInstance.destroy();

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Visits',
                        data: counts,
                        borderColor: '#3b82f6', // blue-500
                        backgroundColor: 'rgba(59, 130, 246, 0.1)',
                        borderWidth: 2,
                        tension: 0.4,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            grid: { color: 'rgba(148, 163, 184, 0.1)' }
                        },
                        x: {
                            grid: { display: false }
                        }
                    }
                }
            });

            // Platform Chart
            const ctxPlatform = document.getElementById('platformChart').getContext('2d');
            const platformLabels = data.byPlatform.map(p => p.platform);
            const platformCounts = data.byPlatform.map(p => p.count);

            // Standard colors for platforms
            const platformColors = {
                'YouTube': '#FF0000',
                'TikTok': '#000000', // or pinkish
                'Instagram': '#E1306C',
                'Facebook': '#1877F2',
                'Twitter': '#1DA1F2',
                'Web': '#64748b'
            };
            const bgColors = platformLabels.map(p => platformColors[p] || '#cbd5e1');

            new Chart(ctxPlatform, {
                type: 'doughnut',
                data: {
                    labels: platformLabels,
                    datasets: [{
                        data: platformCounts,
                        backgroundColor: bgColors,
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    }
                }
            });

            // Platform List
            const platformList = document.getElementById('platformList');
            platformList.innerHTML = data.byPlatform.map(p => `
                <div class="flex justify-between items-center">
                    <span class="flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full" style="background-color: ${platformColors[p.platform] || '#cbd5e1'}"></span>
                        ${p.platform}
                    </span>
                    <span class="font-bold text-slate-300">${p.count}</span>
                </div>
            `).join('');
        }

        function getMethodColor(method) {
            if (method === 'GET') return 'bg-green-500/20 text-green-400';
            if (method === 'POST') return 'bg-blue-500/20 text-blue-400';
            return 'bg-gray-500/20 text-gray-400';
        }

        // Initial Load
        fetchStats();
    </script>
</body>

</html>
